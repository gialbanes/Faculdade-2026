openapi: 3.0.3
info:
  title: API Océane Edition - Atividade 1
  description: API para gestão de e-commerce de cosméticos (Categorias e Produtos)
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Servidor de Desenvolvimento Local

tags:
  - name: Categorias
    description: Gerenciamento de categorias de produtos
  - name: Produtos
    description: Gestão do catálogo de cosméticos

paths:
  /categories:
    get:
      tags: [Categorias]
      summary: Listar todas as categorias
      responses:
        '200':
          description: Lista de categorias retornada com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
    post:
      tags: [Categorias]
      summary: Criar uma nova categoria
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Category'
      responses:
        '201':
          description: Categoria criada

  /categories/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    put:
      tags: [Categorias]
      summary: Atualizar uma categoria existente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Category'
      responses:
        '200':
          description: Categoria atualizada
    delete:
      tags: [Categorias]
      summary: Excluir uma categoria
      responses:
        '204':
          description: Categoria removida

  /products:
    get:
      tags: [Produtos]
      summary: Listar todos os produtos
      responses:
        '200':
          description: Lista de produtos retornada
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
    post:
      tags: [Produtos]
      summary: Cadastrar um novo produto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '201':
          description: Produto cadastrado

  /products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    put:
      tags: [Produtos]
      summary: Atualizar dados de um produto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '200':
          description: Produto atualizado
    delete:
      tags: [Produtos]
      summary: Remover um produto do catálogo
      responses:
        '204':
          description: Produto removido

components:
  schemas:
    Category:
      type: object
      required:
        - name
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Skincare"
        description:
          type: string
          example: "Produtos para hidratação e limpeza facial"

    Product:
      type: object
      required:
        - name
        - category_id
        - price
        - quantity
      properties:
        id:
          type: integer
          example: 101
        category_id:
          type: integer
          example: 1
        name:
          type: string
          example: "Sérum Facial Ácido Hialurônico"
        description:
          type: string
          example: "Hidratação profunda para todos os tipos de pele"
        price:
          type: number
          format: double
          example: 65.00
        quantity:
          type: integer
          example: 30