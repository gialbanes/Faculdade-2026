openapi: 3.0.3
info:
  title: API Océane Edition - Atividade 1
  description: API para gestão de e-commerce de cosméticos (Categorias e Produtos)
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Servidor de Desenvolvimento Local

tags:
  - name: Categorias
    description: Gerenciamento de categorias de produtos
  - name: Produtos
    description: Gestão do catálogo de cosméticos

paths:
  # --- ROTAS DE CATEGORIAS ---
  /categories:
    get:
      tags: [Categorias]
      summary: Listar todas as categorias
      responses:
        '200':
          description: Lista retornada com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
    post:
      tags: [Categorias]
      summary: Criar uma nova categoria
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '201':
          description: Categoria criada com sucesso

  /categories/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [Categorias]
      summary: Buscar categoria por ID
      responses:
        '200':
          description: Categoria encontrada
        '404':
          description: Categoria não encontrada
    put:
      tags: [Categorias]
      summary: Atualizar uma categoria existente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryUpdateRequest'
      responses:
        '200':
          description: Categoria atualizada
    delete:
      tags: [Categorias]
      summary: Excluir uma categoria
      responses:
        '204':
          description: Categoria removida

  # --- ROTAS DE PRODUTOS ---
  /products:
    get:
      tags: [Produtos]
      summary: Listar todos os produtos
      responses:
        '200':
          description: Lista de produtos retornada
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
    post:
      tags: [Produtos]
      summary: Cadastrar um novo produto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '201':
          description: Produto cadastrado

  /products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [Produtos]
      summary: Buscar produto por ID
      responses:
        '200':
          description: Produto encontrado
        '404':
          description: Produto não encontrado
    put:
      tags: [Produtos]
      summary: Atualizar dados de um produto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdateRequest'
      responses:
        '200':
          description: Produto atualizado
    delete:
      tags: [Produtos]
      summary: Remover um produto
      responses:
        '204':
          description: Produto removido

  # --- ROTA ADICIONAL: PRODUTOS POR CATEGORIA ---
  /products/category/{categoryId}:
    parameters:
      - name: categoryId
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [Produtos]
      summary: Listar produtos de uma categoria específica
      responses:
        '200':
          description: Lista de produtos da categoria
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'

components:
  schemas:
    CategoryRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: "Maquiagem"
        description:
          type: string
          example: "Batons, blushes e bases"

    CategoryUpdateRequest:
      type: object
      properties:
        name:
          type: string
          example: "Maquiagem"
        description:
          type: string
          example: "Batons, blushes e bases"

    Category:
      type: object
      required:
        - name
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Maquiagem"
        description:
          type: string
          example: "Batons, blushes e bases"

    ProductRequest:
      type: object
      required:
        - name
        - category_id
        - price
        - quantity
      properties:
        category_id:
          type: integer
          example: 1
        name:
          type: string
          example: "Batom Stick Matte"
        description:
          type: string
          example: "Alta pigmentação e longa duração"
        price:
          type: number
          format: double
          example: 45.90
        quantity:
          type: integer
          example: 50

    ProductUpdateRequest:
      type: object
      properties:
        category_id:
          type: integer
          example: 1
        name:
          type: string
          example: "Batom Stick Matte"
        description:
          type: string
          example: "Alta pigmentação e longa duração"
        price:
          type: number
          format: double
          example: 45.90
        quantity:
          type: integer
          example: 50

    Product:
      type: object
      required:
        - name
        - category_id
        - price
        - quantity
      properties:
        id:
          type: integer
          example: 10
        category_id:
          type: integer
          example: 1
        name:
          type: string
          example: "Batom Stick Matte"
        description:
          type: string
          example: "Alta pigmentação e longa duração"
        price:
          type: number
          format: double
          example: 45.90
        quantity:
          type: integer
          example: 50